spring:
  application:
    name: orders
  datasource:
    url: jdbc:postgresql://localhost:5555/isales_orders
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:29092

server:
  port: 8080

isales:
  order:
    clients:
      products:
        url: 'http://localhost:8081/products'
      customers:
        url: 'http://localhost:8082/customers'
  config:
    kafka:
      server-url: 'localhost:29092'
      topics:
        invoiced-order: 'isales.invoiced-order'
        order-sent: 'isales.order-sent'
        paid-order: 'isales.paid-order'
