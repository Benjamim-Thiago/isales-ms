spring:
  application:
    name: invoicing
  Kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: isales-invoicing
      auto-offset-reset: earliest

isales:
    config:
      kafka:
        topics:
          paid-order: 'isales.paid-order'
          invoiced-order: 'isales.invoiced-order'

server:
  port: 8083

minio:
  endpoint: 'http://localhost:9000'
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: isales.invoicing

logging:
  file:
    name: logs/invoicing.log
  level:
    root: INFO
    org.apache.kafka: WARN
    org.apache.kafka.clients.consumer.ConsumerConfig: ERROR
    org.apache.kafka.clients.producer.ProducerConfig: ERROR
    org.apache.kafka.common.utils.AppInfoParser: WARN
    org.springframework.kafka: WARN

